<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>snaily</title>
<meta name="theme-color" content="#F2EDBD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#6C2C25" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="snaily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preload" as="image" href="images/stamp.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-sans@5.3.0/600.css" rel="stylesheet">
<script>try{const t=localStorage.getItem('snaily-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="intro">
<header class="top">
  <a class="brand" href="#home" aria-label="snaily home"><span id="logo" aria-hidden="true"></span><span class="word">snaily</span></a>
</header>
<main>
  <!-- WELCOME (home): kept minimal on purpose; add details here -->
  <section class="view" id="v-home" aria-label="Home">
    <h1 class="greet" id="greet">hello</h1>
    <a class="primary" href="#write">write a postcard</a>
  </section>

  <section class="view" id="v-write" aria-label="Craft your postcard">
    <!-- the snail and its envelope stay hidden until next: then the card drops in (js/send.js) -->
    <div class="env" id="env" aria-hidden="true"></div>
    <div class="craft-head">
      <h2>Craft Your Postcard</h2>
      <button class="shuffle" id="shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c2.2 0 3.4 1.2 4.5 3l3 5c1 1.6 2.2 2 3.7 2H21M3 17h3c1.5 0 2.5-.6 3.4-1.6M21 7h-3.8c-1.5 0-2.5.6-3.4 1.6M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>randomize</button>
    </div>
    <div id="stage"><canvas id="gl" aria-label="Postcards. Swipe sideways for other designs, tap to flip."></canvas><textarea id="ed" aria-label="write on the card" spellcheck="false"></textarea></div>
    <p class="cname" id="cname" aria-live="polite"></p>
    <div class="bar">
      <p class="hint" id="hint" aria-hidden="true"></p>
      <!-- back sits over the colours, next over the stamps: plain arrows with quiet words -->
      <div class="acts">
        <button class="act" id="wBack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>back</span></button>
        <button class="act" id="next" aria-label="next: add photos"><span>next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <!-- after Lost Post: colours on the left, stamps on the right -->
      <div class="tray">
        <div class="sec">
          <h3 id="hColors">colors</h3>
          <div class="sec-row" role="group" aria-labelledby="hColors">
            <button class="swatch" id="cPaper" data-k="paper" aria-label="Paper color" title="paper" aria-haspopup="true" aria-expanded="false" aria-controls="pColors"></button>
            <button class="swatch" id="cInk" data-k="ink" aria-label="Ink color" title="ink" aria-haspopup="true" aria-expanded="false" aria-controls="pColors"></button>
          </div>
          <div class="pop" id="pColors" role="group" hidden></div>
        </div>
        <div class="sec right">
          <h3 id="hStamps">stamps</h3>
          <div class="sec-row" id="sRow" role="group" aria-labelledby="hStamps"></div>
          <div class="pop right" id="pStamps" role="group" aria-label="All stamps" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="v-board" aria-label="Photo board">
    <div class="board-head"><h2 id="bDate">today</h2><span class="muted" id="bCount"></span></div>
    <div class="board" id="board"></div>
    <input type="file" id="bFile" accept="image/*" multiple hidden>
    <div class="board-foot"><span class="benv" id="bEnv" aria-hidden="true"></span><button class="btn solid" id="bNext" disabled>next →</button></div>
  </section>

  <section class="view" id="v-sent" aria-label="Review and send">
    <div class="empty"><h2>review &amp; send</h2><p class="muted">coming next.</p></div>
  </section>

  <section class="view" id="v-gallery" aria-label="Postcards">
    <h2>postcards</h2>
    <div class="seg" role="group" aria-label="Which postcards">
      <button aria-pressed="true" data-box="sent">sent</button><button aria-pressed="false" data-box="received">received</button>
    </div>
    <p class="empty muted" id="emptyMsg">no sent postcards yet.</p>
  </section>

  <section class="view" id="v-settings" aria-label="Settings">
    <h2>settings</h2>
    <fieldset class="field"><legend>appearance</legend>
      <div class="seg" role="group" aria-label="Appearance">
        <button data-theme-set="system" aria-pressed="true">system</button><button data-theme-set="light" aria-pressed="false">light</button><button data-theme-set="dark" aria-pressed="false">dark</button>
      </div>
    </fieldset>
    <p class="muted">snaily: little postcards, sent slowly.</p>
  </section>
</main>
<nav class="tabs" aria-label="Main">
  <button class="tab t-gallery" data-go="gallery" aria-label="Postcards"><i></i></button>
  <button class="tab t-home" data-go="home" aria-label="Home"><i></i></button>
  <button class="tab t-settings" data-go="settings" aria-label="Settings"><i></i></button>
</nav>
<div class="focus" id="focus" hidden>
  <div class="scrim" id="fScrim"></div>
  <div class="f-body" role="dialog" aria-modal="true" aria-label="Photo and caption">
    <img class="f-photo" id="fPhoto" alt="">
    <div class="bubble" id="fBubble">
      <svg class="tail" viewBox="0 0 40 26" aria-hidden="true"><path d="M3 25 C12 18 18 9 20 2 C24 10 30 18 38 25" /></svg>
      <label class="sr" for="fCap">caption</label>
      <textarea id="fCap" rows="3" maxlength="120" placeholder="what happened here?" spellcheck="true"></textarea>
      <span class="count" id="fCount" aria-hidden="true"></span>
    </div>
    <div class="f-actions"><button class="link" id="fReplace">replace</button><button class="link" id="fRemove">remove</button><button class="btn solid" id="fDone">done</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="intro" aria-hidden="true"><div id="shake"><div class="ink"></div><div id="stampWrap"><div class="stamp full"></div><div class="stamp empty"></div></div></div></div>
<div id="fly" aria-hidden="true"><div class="fx"><div class="fy"><div class="fs"><div class="fq"><div class="fr"></div></div></div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/store.js"></script>
<script src="js/designs.js"></script>
<script src="js/postcard.js"></script>
<script src="js/shell.js"></script>
<script src="js/craft.js"></script>
<script src="js/board.js"></script>
<script src="js/send.js"></script>
</body>
</html>
