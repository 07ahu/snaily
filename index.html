<title>snaily</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#F2EDBD;--tx:#6C2C25;--red:#EB5E3A;--blue:#7CA2E0;--line:rgba(108,44,37,.14);--ease:cubic-bezier(.2,.8,.2,1);box-sizing:border-box;
 --snail:url(images/snail.png);--stamp:url(images/stamp.png);--stamp-empty:url(images/stamp-empty.png);
 --i-gallery:url(images/nav-gallery.png);--i-home:url(images/nav-home.png);--i-settings:url(images/nav-settings.png)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#6C2C25;--tx:#F2EDBD;--line:rgba(242,237,189,.16);
 --snail:url(images/snail-dark.png);--stamp:url(images/stamp-dark.png);--stamp-empty:url(images/stamp-empty-dark.png);
 --i-gallery:url(images/nav-gallery-dark.png);--i-home:url(images/nav-home-dark.png);--i-settings:url(images/nav-settings-dark.png)}}
:root[data-theme="dark"]{--bg:#6C2C25;--tx:#F2EDBD;--line:rgba(242,237,189,.16);
 --snail:url(images/snail-dark.png);--stamp:url(images/stamp-dark.png);--stamp-empty:url(images/stamp-empty-dark.png);
 --i-gallery:url(images/nav-gallery-dark.png);--i-home:url(images/nav-home-dark.png);--i-settings:url(images/nav-settings-dark.png)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Fraunces,Georgia,serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;font:inherit;color:inherit}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 6px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;color:var(--tx);text-decoration:none;border-radius:12px}
#logo{width:49px;height:34px;background:var(--snail) center/contain no-repeat}
.word{font-weight:600;font-size:24px;letter-spacing:-.01em}
.back{margin-left:auto;min-height:44px;padding:0 10px;border:0;background:none;font-size:17px;cursor:pointer;border-radius:12px}

/* views */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:auto;padding:12px 20px 24px}
.view.on{display:flex;animation:viewIn .28s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
.view h2{font-weight:600;font-size:28px;margin:4px 0 16px}
.muted{opacity:.7;font-size:16px}

/* ===== WELCOME (home) — kept minimal on purpose; add details here ===== */
#v-home{align-items:center;justify-content:center;text-align:center;gap:24px}
.greet{font-weight:600;font-size:32px;margin:0}
.primary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:99px;background:var(--tx);color:var(--bg);text-decoration:none;font-weight:600;font-size:18px;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
@media (hover:hover){.primary:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(60,20,15,.25)}}
.primary:active{transform:scale(.96)}
/* ===== end WELCOME ===== */

/* write (the postcard) */
#v-write{padding:0}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.bar{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 16px 16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#dots{gap:2px}
.dot{width:44px;height:44px;padding:0;border:0;background:transparent;position:relative;cursor:pointer;border-radius:50%}
.dot::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--c);border:3px solid var(--bg);outline:2px solid var(--tx)}
.dot.on::before{outline:4px solid var(--red)}
.btn{font:inherit;font-size:18px;min-height:48px;min-width:160px;padding:0 1.4em;border-radius:99px;border:2px solid var(--tx);background:transparent;color:var(--tx);cursor:pointer}
#ed::placeholder{color:#6C2C25;opacity:.35}#ed{position:absolute;display:none;z-index:2;margin:0;padding:0;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:transparent;caret-color:transparent;opacity:0;pointer-events:none;font-family:Caveat,cursive;font-weight:500;white-space:pre-wrap;box-sizing:border-box;-webkit-user-select:text;user-select:text}

/* gallery + settings */
.seg{display:inline-flex;border:2px solid var(--tx);border-radius:99px;padding:3px;gap:3px;align-self:flex-start;margin-bottom:28px}
.seg button{min-height:40px;min-width:96px;padding:0 16px;border:0;border-radius:99px;background:transparent;cursor:pointer;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
.empty{margin:auto;text-align:center;padding-bottom:40px}
.field{border:0;padding:0;margin:0 0 28px}.field legend{font-weight:600;font-size:18px;margin-bottom:10px;padding:0}

/* bottom nav */
.tabs{display:flex;justify-content:space-around;align-items:center;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid var(--line);background:var(--bg)}
.tab{width:72px;height:60px;border:0;background:transparent;position:relative;border-radius:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.tab i{display:block;width:42px;height:42px;background:var(--ic) center/contain no-repeat;opacity:.62;transition:transform .2s var(--ease),opacity .2s var(--ease),filter .2s var(--ease)}
.tab::after{content:'';position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--red);transform:scale(0);transition:transform .25s var(--ease)}
.tab[aria-current="page"] i{opacity:1;transform:translateY(-3px)}
.tab[aria-current="page"]::after{transform:scale(1)}
@media (hover:hover){.tab:hover i{opacity:1;transform:translateY(-5px) rotate(-3deg);filter:drop-shadow(0 7px 5px rgba(60,20,15,.28))}}
.tab:active i{transform:scale(.9);transition-duration:.08s}
.t-gallery{--ic:var(--i-gallery)}.t-home{--ic:var(--i-home)}.t-settings{--ic:var(--i-settings)}

.dot:focus-visible::before,.btn:focus-visible,.tab:focus-visible,.brand:focus-visible,.back:focus-visible,.primary:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center}
#shake{position:relative;width:min(66vw,300px);aspect-ratio:640/476}
#stampWrap,.ink{position:absolute;inset:0}
.stamp{position:absolute;inset:0;background:var(--stamp) center/contain no-repeat}
.stamp.empty{background-image:var(--stamp-empty);opacity:0}
.ink{border-radius:50%;background:radial-gradient(closest-side,var(--tx),transparent);opacity:0}
#fly{position:fixed;z-index:60;left:0;top:0;pointer-events:none;display:none}
#fly div{width:100%;height:100%}
#fly .fs{transform-origin:0 0}#fly .fq{transform-origin:50% 100%}
#fly .fr{background:var(--snail) center/contain no-repeat}
body.intro #logo{visibility:hidden}
body.intro .word,body.intro .tab,body.intro .view.on>*{opacity:0}
body.reveal .word{animation:wordIn .45s var(--ease) both}
body.reveal .tab{animation:rise .5s var(--ease) both}
body.reveal .tab:nth-child(2){animation-delay:.06s}body.reveal .tab:nth-child(3){animation-delay:.12s}
body.reveal .view.on>*{animation:rise .5s var(--ease) both .08s}
@keyframes wordIn{from{opacity:0;transform:translateX(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}.tab i,.primary{transition:opacity .2s}
 .tab[aria-current="page"] i,.tab:hover i,.tab:active i{transform:none!important;filter:none!important}
 body.reveal .word,body.reveal .tab,body.reveal .view.on>*{animation:fadeOnly .3s both}}
@keyframes fadeOnly{from{opacity:0}}
</style>
</head>
<body class="intro">
<header class="top">
  <a class="brand" href="#home" aria-label="snaily home"><span id="logo" aria-hidden="true"></span><span class="word">snaily</span></a>
  <button class="back" id="back" hidden>‹ back</button>
</header>
<main>
  <!-- WELCOME (home): kept minimal on purpose; add details here -->
  <section class="view" id="v-home" aria-label="Home">
    <h1 class="greet" id="greet">hello</h1>
    <a class="primary" href="#write">write a postcard</a>
  </section>

  <section class="view" id="v-write" aria-label="Write a postcard">
    <div id="stage"><canvas id="gl" aria-label="3D postcard. Drag to spin it."></canvas><textarea id="ed" aria-label="write on the card" spellcheck="false"></textarea></div>
    <div class="bar">
      <div class="row" id="dots"></div>
      <div class="row"><button class="btn" id="flip">flip</button></div>
    </div>
  </section>

  <section class="view" id="v-gallery" aria-label="Postcards">
    <h2>postcards</h2>
    <div class="seg" role="group" aria-label="Which postcards">
      <button aria-pressed="true" data-box="sent">sent</button><button aria-pressed="false" data-box="received">received</button>
    </div>
    <p class="empty muted" id="emptyMsg">no sent postcards yet.</p>
  </section>

  <section class="view" id="v-settings" aria-label="Settings">
    <h2>settings</h2>
    <fieldset class="field"><legend>appearance</legend>
      <div class="seg" role="group" aria-label="Appearance">
        <button data-theme-set="system" aria-pressed="true">system</button><button data-theme-set="light" aria-pressed="false">light</button><button data-theme-set="dark" aria-pressed="false">dark</button>
      </div>
    </fieldset>
    <p class="muted">snaily: little postcards, sent slowly.</p>
  </section>
</main>
<nav class="tabs" aria-label="Main">
  <button class="tab t-gallery" data-go="gallery" aria-label="Postcards"><i></i></button>
  <button class="tab t-home" data-go="home" aria-label="Home"><i></i></button>
  <button class="tab t-settings" data-go="settings" aria-label="Settings"><i></i></button>
</nav>

<script>
/* ---------- app shell: routing, nav, settings ---------- */
const VIEWS=['home','write','gallery','settings'],body=document.body;
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
function route(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'home';
 $$('.view').forEach(el=>el.classList.toggle('on',el.id==='v-'+v));
 $$('.tab').forEach(t=>{const cur=t.dataset.go===(v==='write'?'home':v);cur?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current')});
 $('#back').hidden=v!=='write';setWrite(v==='write')}
addEventListener('hashchange',route);
$$('.tab').forEach(t=>t.onclick=()=>{location.hash=t.dataset.go});
$('#back').onclick=()=>{location.hash='home'};
const h=new Date().getHours();$('#greet').textContent=h<12?'good morning':h<18?'good afternoon':'good evening';
$$('[data-box]').forEach(b=>b.onclick=()=>{$$('[data-box]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#emptyMsg').textContent=`no ${b.dataset.box} postcards yet.`});
function setTheme(v,save){const r=document.documentElement;v==='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',v);
 $$('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===v));if(save)try{localStorage.setItem('snaily-theme',v)}catch(e){}}
$$('[data-theme-set]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet,true));

/* ---------- intro: stamp thump, snail hops into the logo ---------- */
(function intro(){
 const ov=$('#intro'),shake=$('#shake'),wrap=$('#stampWrap'),full=$('.stamp.full'),empty=$('.stamp.empty'),ink=$('.ink'),fly=$('#fly'),logo=$('#logo');
 const [fx,fy,fs,fq,fr]=['.fx','.fy','.fs','.fq','.fr'].map(c=>fly.querySelector(c));
 const SNAIL_BOX=[.1953,.2017,.8375,.792],SNAIL_AR=480/334,TILT=-3;
 const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let done=false;
 const play=(el,kf,o)=>el.animate(kf,{fill:'forwards',...o}).finished.catch(()=>{});
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 function finish(){if(done)return;done=true;removeEventListener('keydown',finish);
  document.getAnimations().forEach(a=>{const t=a.effect&&a.effect.target;if(t&&(ov.contains(t)||fly.contains(t)))a.cancel()});
  ov.remove();fly.remove();logo.style.visibility='';body.classList.remove('intro');body.classList.add('reveal');setTimeout(()=>body.classList.remove('reveal'),900)}
 ov.addEventListener('pointerdown',finish);addEventListener('keydown',finish);
 const load=src=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=src});

 Promise.race([Promise.all(['--stamp','--stamp-empty','--snail'].map(v=>load(bg(v)))),wait(1500)]).then(go);

 async function go(){if(done)return;
  if(calm){await play(wrap,[{opacity:0},{opacity:1}],{duration:300});await wait(500);if(done)return;
   await play(ov,[{opacity:1},{opacity:0}],{duration:400});return finish()}
  // 1. stamp thump
  const thump=play(wrap,[
   {transform:'scale(2.2) rotate(-10deg)',opacity:0,easing:'cubic-bezier(.55,0,.9,.45)'},
   {transform:`scale(1) rotate(${TILT}deg)`,opacity:.85,offset:.72},
   {transform:`scale(1.035,.955) rotate(${TILT}deg)`,opacity:.92,offset:.86},
   {transform:`scale(1) rotate(${TILT}deg)`,opacity:1}],{duration:460});
  await wait(330);if(done)return;
  play(shake,[{transform:'translate(0,0)'},{transform:'translate(-3px,2px)'},{transform:'translate(3px,-1px)'},{transform:'translate(-2px,0)'},{transform:'translate(0,0)'}],{duration:140});
  play(ink,[{transform:'scale(.7)',opacity:.22},{transform:'scale(1.7)',opacity:0}],{duration:650,easing:'cubic-bezier(.2,.7,.3,1)'});
  await thump;await wait(420);if(done)return;
  // 2. the snail leaves the stamp
  const sw=shake.offsetWidth,sh=shake.offsetHeight,sr=shake.getBoundingClientRect();
  const bw=(SNAIL_BOX[2]-SNAIL_BOX[0])*sw*1.06,bh=bw/SNAIL_AR;
  let cx=(SNAIL_BOX[0]+SNAIL_BOX[2])/2*sw-sw/2,cy=SNAIL_BOX[3]*sh-bh*.47-sh/2;
  const a=TILT*Math.PI/180;[cx,cy]=[cx*Math.cos(a)-cy*Math.sin(a),cx*Math.sin(a)+cy*Math.cos(a)];
  const x0=sr.left+sr.width/2+cx-bw/2,y0=sr.top+sr.height/2+cy-bh/2;
  Object.assign(fly.style,{display:'block',left:x0+'px',top:y0+'px',width:bw+'px',height:bh+'px'});
  fr.style.transform=`rotate(${TILT}deg)`;
  play(empty,[{opacity:0},{opacity:1}],{duration:80});play(full,[{opacity:1},{opacity:0}],{duration:80,delay:40});
  // crouch, then pop up toward the viewer
  const P=1.15,px=-(P-1)/2*bw,py=-56-(P-1)/2*bh;
  await play(fq,[{transform:'scale(1,1)'},{transform:'scale(1.08,.8)'}],{duration:130,easing:'ease-out'});if(done)return;
  fr.animate([{transform:`rotate(${TILT}deg)`},{transform:'rotate(0deg)'}],{duration:260,fill:'forwards'});
  play(fq,[{transform:'scale(1.08,.8)'},{transform:'scale(.92,1.12)',offset:.4},{transform:'scale(1,1)'}],{duration:300});
  play(fs,[{transform:'scale(1)',filter:'drop-shadow(0 0 0 rgba(60,20,15,0))'},{transform:`scale(${P})`,filter:'drop-shadow(0 14px 10px rgba(60,20,15,.25))'}],{duration:300,easing:'cubic-bezier(.2,.8,.3,1)'});
  play(fx,[{transform:'translateX(0)'},{transform:`translateX(${px}px)`}],{duration:300,easing:'cubic-bezier(.2,.8,.3,1)'});
  await play(fy,[{transform:'translateY(0)'},{transform:`translateY(${py}px)`}],{duration:300,easing:'cubic-bezier(.2,.8,.3,1)'});
  if(done)return;

  const lr=logo.getBoundingClientRect(),dx=lr.left-x0,dy=lr.top-y0,sT=lr.width/bw;
  const hops=[{f:.62,g:.06,peak:90,d:360},{f:.96,g:.16,peak:60,d:320},{f:1,g:1,peak:46,d:440}];
  let pxs=px,pys=py,ps=P;
  play(wrap,[{transform:`scale(1) rotate(${TILT}deg)`,opacity:1},{transform:`scale(.9) rotate(${TILT}deg)`,opacity:0}],{duration:320,delay:hops[0].d-60,easing:'ease-in'});
  for(const [i,hp] of hops.entries()){if(done)return;
   const nx=px+(dx-px)*hp.f,ny=py+(dy-py)*hp.g,ns=P+(sT-P)*hp.f,top=Math.max(Math.min(pys,ny)-hp.peak,6-y0);
   if(i===2)play(ov,[{backgroundColor:getComputedStyle(ov).backgroundColor},{backgroundColor:'transparent'}],{duration:hp.d+60})

   play(fx,[{transform:`translateX(${pxs}px)`},{transform:`translateX(${nx}px)`}],{duration:hp.d,easing:'linear'});
   play(fs,[{transform:`scale(${ps})`},{transform:`scale(${ns})`}],{duration:hp.d,easing:'linear'});
   play(fq,[{transform:'scale(.9,1.12)'},{transform:'scale(1,1)',offset:.35},{transform:'scale(1,1)',offset:.85},{transform:'scale(1.14,.84)'}],{duration:hp.d});

   pxs=nx;pys=ny;ps=ns}
  if(done)return;
  await play(fq,[{transform:'scale(1.14,.84)'},{transform:'scale(.97,1.04)',offset:.5},{transform:'scale(1,1)'}],{duration:180});
  logo.style.visibility='';finish()}
})();
