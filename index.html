<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>snaily</title>
<meta name="theme-color" content="#F2EDBD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#6C2C25" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="snaily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preload" as="image" href="images/stamp.png">
<link rel="preload" as="image" href="images/snail.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('snaily-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="intro">
<header class="top">
  <a class="brand" href="#home" aria-label="snaily home"><span id="logo" aria-hidden="true"></span><span class="word">snaily</span></a>
  <button class="back" id="back" hidden>‹ back</button>
</header>
<main>
  <!-- WELCOME (home): kept minimal on purpose; add details here -->
  <section class="view" id="v-home" aria-label="Home">
    <h1 class="greet" id="greet">hello</h1>
    <a class="primary" href="#write">write a postcard</a>
  </section>

  <section class="view" id="v-write" aria-label="Write a postcard">
    <div id="stage"><canvas id="gl" aria-label="3D postcard. Drag to spin it."></canvas><textarea id="ed" aria-label="write on the card" spellcheck="false"></textarea></div>
    <div class="bar">
      <div class="row" id="dots"></div>
      <div class="row"><button class="btn" id="flip">flip</button></div>
    </div>
  </section>

  <section class="view" id="v-gallery" aria-label="Postcards">
    <h2>postcards</h2>
    <div class="seg" role="group" aria-label="Which postcards">
      <button aria-pressed="true" data-box="sent">sent</button><button aria-pressed="false" data-box="received">received</button>
    </div>
    <p class="empty muted" id="emptyMsg">no sent postcards yet.</p>
  </section>

  <section class="view" id="v-settings" aria-label="Settings">
    <h2>settings</h2>
    <fieldset class="field"><legend>appearance</legend>
      <div class="seg" role="group" aria-label="Appearance">
        <button data-theme-set="system" aria-pressed="true">system</button><button data-theme-set="light" aria-pressed="false">light</button><button data-theme-set="dark" aria-pressed="false">dark</button>
      </div>
    </fieldset>
    <p class="muted">snaily: little postcards, sent slowly.</p>
  </section>
</main>
<nav class="tabs" aria-label="Main">
  <button class="tab t-gallery" data-go="gallery" aria-label="Postcards"><i></i></button>
  <button class="tab t-home" data-go="home" aria-label="Home"><i></i></button>
  <button class="tab t-settings" data-go="settings" aria-label="Settings"><i></i></button>
</nav>
<div id="intro" aria-hidden="true"><div id="shake"><div class="ink"></div><div id="stampWrap"><div class="stamp full"></div><div class="stamp empty"></div></div></div></div>
<div id="fly" aria-hidden="true"><div class="fx"><div class="fy"><div class="fs"><div class="fq"><div class="fr"></div></div></div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/postcard.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
